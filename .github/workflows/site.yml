name: Dashboard

# Zet het dashboard (map web/) via FTPS met certificaatcontrole op https://beheer.tunr.online.
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (eigen FTP-account van beheer.tunr.online, komt direct uit in de map
# van het subdomein), optioneel FTP_DIR. Ontbreekt er een, dan alleen een waarschuwing.
# De inhoud van builds/ op de server (pakketten, manifest.json, key.php) wordt nooit overschreven of verwijderd:
# alleen builds/.htaccess gaat mee (mirror zonder --delete, met uitsluitingen).

on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/ftps.sh', '.github/workflows/site.yml']
  workflow_dispatch:

concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Controleren
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # het dashboard moet noindex en robots.txt houden, en mag geen pakketten bevatten
          grep -q 'name="robots" content="noindex' web/index.html || { echo "::error::web/index.html mist noindex"; exit 1; }
          grep -qx 'Disallow: /' web/robots.txt || { echo "::error::web/robots.txt blokkeert niet alles"; exit 1; }
          if find web/builds -type f ! -name .htaccess | grep -q .; then echo "::error::web/builds bevat bestanden; daar hoort alleen .htaccess"; exit 1; fi
          missing=""
          for k in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do [ -n "${!k:-}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::warning::Secrets ontbreken:$missing — dashboard niet geüpload. Zie README.md."; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: lftp installeren
        if: steps.check.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null

      - name: Uploaden via FTPS
        if: steps.check.outputs.skip != '1'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USERNAME_ALT: ${{ secrets.FTP_USERNAME_ALT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          source tools/ftps.sh
          ftps_connect
          T="$FTPS_TARGET"
          [ "$T" != "." ] && { ftps_run "mkdir -p -f \"$T\"" >/dev/null 2>&1 || true; }
          ftps_run "mirror -R --parallel=4 --exclude-glob .DS_Store --exclude-glob 'builds/*.zip' --exclude-glob 'builds/*.apk' \
            --exclude-glob 'builds/manifest.json*' --exclude-glob 'builds/key.php' --exclude-glob 'builds/apple/' --exclude-glob 'builds/android/' \
            --exclude-glob 'builds/beheer/' ./web/ \"$T\"" >/dev/null 2>&1 || { echo "::error::Uploaden naar de FTP-server mislukt."; exit 1; }
          echo "::notice::Dashboard geüpload."
          # rechten: bestanden 644, map builds 755 (de inhoud blijft afgesloten via builds/.htaccess)
          ftps_try "cd \"$T\"; chmod 644 index.html admin.css admin.js config.js favicon.png apple-touch-icon.png icon-192.png robots.txt .htaccess dl.php; chmod 755 builds; chmod 644 builds/.htaccess" >/dev/null 2>&1 \
            && echo "::notice::Rechten gezet." || echo "::warning::Rechten niet (allemaal) gezet."

      - name: Controleren of beheer.tunr.online het dashboard toont
        if: steps.check.outputs.skip != '1' && success()
        run: |
          sleep 5
          url=https://beheer.tunr.online/
          code=$(curl -sL --max-time 20 -o /tmp/site.html -w '%{http_code}' "$url" || true)
          if grep -q 'name="tunr-app" content="beheer"' /tmp/site.html 2>/dev/null; then
            echo "::notice::$url toont het dashboard (HTTP $code)"
            ping=$(curl -s --max-time 20 "${url}dl.php?ping=1" || true)
            echo "$ping" | grep -q '"ok":true' && echo "::notice::dl.php werkt ($(echo "$ping" | grep -o '"ready":[a-z]*'))" \
              || echo "::warning::dl.php geeft geen goed antwoord: draait PHP op beheer.tunr.online?"
            for f in builds/ builds/.htaccess builds/manifest.json builds/key.php; do
              c=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' "${url}$f" || true)
              [ "$c" = 200 ] && { echo "::error::${url}$f is rechtstreeks bereikbaar (HTTP 200)"; exit 1; }
            done
            echo "::notice::Map builds/ is afgesloten"
            curl -s -o /dev/null -D /tmp/h.txt --max-time 20 "$url" || true
            for h in 'x-robots-tag: noindex' 'strict-transport-security: max-age=31536000' "frame-ancestors 'none'" "connect-src 'self' https://*.supabase.co"; do
              tr -d '\r' < /tmp/h.txt | grep -qiF "$h" || echo "::warning::Header ontbreekt op $url: $h (wordt .htaccess gelezen?)"
            done
            r=$(curl -s -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' "http://beheer.tunr.online/robots.txt?x=1" || true)
            [ "$r" = "301 https://beheer.tunr.online/robots.txt?x=1" ] && echo "::notice::http stuurt door naar https" \
              || echo "::warning::http://beheer.tunr.online/ stuurt niet (goed) door naar https ('$r')"
          elif ! getent hosts beheer.tunr.online >/dev/null; then
            echo "::warning::beheer.tunr.online bestaat nog niet in DNS: maak het subdomein aan in cPanel (zie README.md)."
          else
            echo "::warning::$url geeft HTTP ${code:-geen antwoord}, nog niet het dashboard: wijst het subdomein naar de map van het FTP-account, en is er een SSL-certificaat?"
          fi
