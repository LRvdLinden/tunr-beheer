# BeheerTunr: native beheer-app voor Tunr (iPhone, iPad en Mac). Zie docs/CONTRACT.md.
# Eén Xcode-project met één multiplatform-target (iOS + native macOS, geen Mac Catalyst), net als de Tunr-app.
# Niet in Xcode zelf wijzigen: pas dit bestand aan en draai `xcodegen generate` (de workflow Beheer-app doet dit ook
# en commit apple/BeheerTunr.xcodeproj).
name: BeheerTunr
options:
  bundleIdPrefix: nl.lrvdlinden
  # Nederlands is de standaardtaal; Engels via Shared/Resources/en.lproj
  developmentLanguage: nl
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Versie 1.0.0; alleen het buildnummer gaat omhoog
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
    # Team van Léon van der Linden; automatisch ondertekenen
    DEVELOPMENT_TEAM: EU3UY476T6
    CODE_SIGN_STYLE: Automatic

targets:
  BeheerTunr:
    type: application
    # Eén target voor iPhone/iPad (iOS) en de Mac (native macOS)
    supportedDestinations: [iOS, macOS]
    sources:
      # alle Swift-code, Assets.xcassets en Resources (Localizable.strings nl/en)
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.tunr.beheer
        PRODUCT_NAME: BeheerTunr
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "Apple Development"

        # Info.plist per SDK (handgeschreven, in Config/ = geen bronmap)
        INFOPLIST_FILE: Config/Info-iOS.plist
        "INFOPLIST_FILE[sdk=iphoneos*]": Config/Info-iOS.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": Config/Info-iOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": Config/Info-macOS.plist

        # Entitlements per SDK (macOS: sandbox, netwerk, Keychain-groep)
        CODE_SIGN_ENTITLEMENTS: Config/BeheerTunr-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/BeheerTunr-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/BeheerTunr-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/BeheerTunr-macOS.entitlements

        # App-icoon (gemaakt met tools/make_icon.py)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        # iPhone + iPad
        "TARGETED_DEVICE_FAMILY[sdk=iphone*]": "1,2"

        # Geen Catalyst / "Designed for iPad" / Vision Pro: de Mac heeft de native macOS-build
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

        # Mac: hardened runtime (sandbox staat in de entitlements)
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"

# Gedeeld scheme (staat in BeheerTunr.xcodeproj/xcshareddata): bovenin Xcode kies je iPhone, iPad of Mac
schemes:
  BeheerTunr:
    build:
      targets:
        BeheerTunr: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
